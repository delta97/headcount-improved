name: release

# Runtime packages are derived artifacts (D37): never committed, always built from a known
# commit. Publishing a release builds the Codex package from the tagged tree, proves it
# matches the canonical source, and attaches the archive — so every installable package
# traces to exactly one commit and users never need a committed duplicate tree.
on:
  release:
    types: [published]

permissions:
  contents: write # required to attach the built archive to the release

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Codex package
        run: python3 scripts/package/codex.py --output dist/headcount-codex
      - name: Validate package against canonical source
        run: python3 scripts/package/validate.py dist/headcount-codex
      - name: Archive
        run: |
          tar -C dist -czf "headcount-codex-${GITHUB_REF_NAME}.tar.gz" headcount-codex
          (cd dist && zip -qr "../headcount-codex-${GITHUB_REF_NAME}.zip" headcount-codex)
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "headcount-codex-${GITHUB_REF_NAME}.tar.gz" \
            "headcount-codex-${GITHUB_REF_NAME}.zip" \
            --clobber --repo "$GITHUB_REPOSITORY"
